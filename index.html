<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
    />
    <title>Calculadora IMC</title>
  </head>
  <body>
    <main id="container">
      <section id="img">
        <img src="assets/images/illustration.png" alt="Imagem Ilustrativa" />
      </section>
      <section id="calculator">
        <form id="form">
          <h1 id="title">Calculadora - IMC</h1>

          <!--PESO-->

          <div class="input-box">
            <label for="weight"> Peso em Kg </label>
            <div class="input-field">
              <i class="fa-solid fa-weight-scale"></i>
              <input type="number" id="weight" required />
              <span>kg</span>
            </div>
          </div>

          <!--ALTURA-->

          <div class="input-box">
            <label for="height"> Altura em metros </label>
            <div class="input-field">
              <i class="fa-solid fa-ruler-vertical"></i>
              <input
                type="number"
                id="height"
                step="0.01"
                min="0.01"
                required
              />
              <span>m</span>
            </div>
          </div>
          <button id="calculate">Calcular</button>
          <button type="reset" id="clear">Limpar</button>
        </form>
        <div id="infos" class="hidden">
          <div id="result">
            <div id="bmi">
              <span id="value">55</span>
              <span>Seu IMC</span>
            </div>

            <div id="description">
              <span></span>
            </div>
          </div>

          <div id="more_info">
            <a
              href="https://mundoeducacao.uol.com.br/saude-bem-estar/imc.htm"
              target="_blank"
              rel="noopener noreferrer"
            >
              Saiba mais sobre o IMC
              <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>
          </div>
        </div>
      </section>
    </main>
    <script src="assets/js/script.js"></script>
  </body>
</html>
